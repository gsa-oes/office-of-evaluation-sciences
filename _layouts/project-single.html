---
layout: page
class: page-project-single
---
<div class="image-credit">
  {% if page.image-credit %}
  <p><a href="{{ page.image-credit }}" target="_blank">Photo credit</a></p>
  {% endif %}
</div>

{% if page.summarybox %}
<div class="grid-row grid-gap-lg">
  <div class="tablet:grid-col-8 usa-prose">
    {% include summarybox.html %}
  </div>
  <div class="tablet:grid-col-4 single-sidebar">
    {% include project-details.html %}
  </div>
</div>

<div class="grid-row grid-gap-lg">
  <div class="tablet:grid-col-8 margin-bottom-2">
    <div class="usa-prose" id="project-content">
      {{ content }}
    </div>
  </div>
  <div class="tablet:grid-col-4 single-sidebar">
    <aside
      class="usa-in-page-nav position-sticky top-4 margin-left-0 margin-top-0"
      data-main-content-selector="#project-content"
      data-heading-elements="h2"
      data-title-text="On this page">
    </aside>
  </div>
</div>
{% else %}
<div class="grid-row grid-gap-lg">
  <div class="tablet:grid-col-8 margin-bottom-2">
    <div class="usa-prose" id="project-content">
      {{ content }}
    </div>
  </div>
  <div class="tablet:grid-col-4 single-sidebar">
    {% include project-details.html %}
    <aside
      class="usa-in-page-nav position-sticky top-4 margin-left-0 margin-top-4"
      data-main-content-selector="#project-content"
      data-heading-elements="h2"
      data-title-text="On this page">
    </aside>
  </div>
</div>
{% endif %}
